[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-quiz-builder"
version = "0.1.0"
description = "Turn any word list or text file into printable study quizzes, offline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["vocabulary", "quiz", "study", "spaced-repetition", "offline", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
llm = ["requests>=2.28"]
dev = ["pytest>=8"]

[project.scripts]
vocab-quiz = "vocabQuizBuilder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["vocabQuizBuilder*"]
